services:
  web:
    image: nginx:alpine
    platform: linux/amd64
    volumes:
      - ./app:/usr/share/nginx/html:ro
    ports:
      - "81:80"
    depends_on:
      - api

  api:
    image: node:20-alpine
    volumes:
      - ./nodeapp:/usr/src/app
    ports:
      - "82:9000"
    working_dir: /usr/src/app
    command: sh -c "chmod +x run.sh && ./run.sh"